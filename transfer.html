<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Bank - Transfer Money</title>
  <meta name="description" content="Send money instantly to any bank account with Antigravity Bank.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="phone-wrapper">
    <div class="phone-screen">

      <div class="status-bar" id="app-status-bar">
        <span id="status-time">09:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-three-quarters"></i>
        </div>
      </div>

      <div class="screen-container">
        <div id="screen-transfer" class="screen active">

          <div class="sub-screen-header">
            <a href="home.html" class="back-btn" style="text-decoration:none;"><i class="fa-solid fa-arrow-left"></i></a>
            <h2 style="font-size:18px;">Transfer Money</h2>
          </div>

          <p class="section-title">Enter Recipient Account Number</p>
          <div class="card" id="recipient-card" style="padding:16px;margin-bottom:20px;cursor:pointer;border:2px solid transparent;transition:border-color 0.2s,box-shadow 0.2s;" onclick="focusRecipientInput()">
            <div style="display:flex;align-items:center;gap:14px;">
              <div style="width:44px;height:44px;border-radius:12px;background:hsl(220,100%,95%);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="fa-solid fa-keyboard" style="color:var(--primary-blue);font-size:18px;"></i>
              </div>
              <div style="flex:1;">
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500;">Recipient Account Number</div>
                <input type="tel" id="recipient-acct-input" class="input-field" placeholder="Enter 10-digit account number" maxlength="10"
                  style="border:none;padding:0;font-size:15px;font-weight:600;background:transparent;outline:none;width:100%;color:var(--text-primary);"
                  oninput="onRecipientInput(this.value)" />
              </div>
              <i class="fa-solid fa-chevron-right" style="color:var(--text-secondary);font-size:14px;"></i>
            </div>
          </div>

          <div class="input-group">
            <label class="input-label">Select Bank</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-building-columns field-icon"></i>
              <select class="input-field" style="padding-left:44px;cursor:pointer;appearance:none;">
                <option>Antigravity Bank</option><option>First Bank</option><option>GTBank</option>
                <option>Zenith Bank</option><option>Access Bank</option><option>UBA</option>
              </select>
            </div>
          </div>
          <div class="input-group">
            <label class="input-label">Account Number</label>
            <div class="input-icon-wrap">
              <i class="fa-solid fa-hashtag field-icon"></i>
              <input type="tel" class="input-field" placeholder="10-digit account number" maxlength="10">
            </div>
          </div>

          <!-- Verified Recipient Card -->
          <div class="card" id="verified-recipient-card" style="padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .3s;">
            <div class="avatar" id="recipient-initials" style="flex-shrink:0;">AJ</div>
            <div>
              <div style="font-size:14px;font-weight:700;" id="recipient-fullname">Ada Joy Okafor</div>
              <div style="font-size:12px;color:var(--text-secondary);" id="recipient-bank-name">Antigravity Bank</div>
            </div>
            <i class="fa-solid fa-circle-check" style="margin-left:auto;color:var(--accent-green);font-size:20px;"></i>
          </div>

          <button class="btn btn-primary" id="continue-btn" onclick="goToAmount()" style="opacity:.4;pointer-events:none;">
            <i class="fa-solid fa-arrow-right"></i> Continue to Amount
          </button>

        </div>
      </div><!-- /screen-container -->



      <!-- Bottom Nav -->
      <nav class="bottom-nav">
        <a href="home.html" class="nav-item" style="text-decoration:none;">
          <i class="fa-solid fa-house" style="font-size:20px;"></i><span>Home</span>
        </a>
        <a href="history.html" class="nav-item" style="text-decoration:none;">
          <i class="fa-solid fa-clock-rotate-left" style="font-size:20px;"></i><span>History</span>
        </a>
        <a href="transfer.html" class="nav-item active" style="text-decoration:none;">
          <i class="fa-solid fa-arrow-right-arrow-left" style="font-size:20px;"></i><span>Transfer</span>
        </a>
        <a href="cards.html" class="nav-item" style="text-decoration:none;">
          <i class="fa-solid fa-credit-card" style="font-size:20px;"></i><span>Cards</span>
        </a>
        <a href="profile.html" class="nav-item" style="text-decoration:none;">
          <i class="fa-regular fa-circle-user" style="font-size:20px;"></i><span>Profile</span>
        </a>
      </nav>

    </div>
  </div>

  <script>

    function focusRecipientInput() {

      const input = document.getElementById('recipient-acct-input');
      input.focus();
    }

    document.addEventListener('DOMContentLoaded', function () {
      const input = document.getElementById('recipient-acct-input');
      const card  = document.getElementById('recipient-card');
      input.addEventListener('focus', function () {
        card.style.borderColor = 'var(--primary-blue)';
        card.style.boxShadow = '0 0 0 3px hsl(220,100%,93%)';
      });
      input.addEventListener('blur', function () {
        card.style.borderColor = 'transparent';
        card.style.boxShadow = 'none';
      });
    });

    function onRecipientInput(val) {
      // mirror value into the separate Account Number field below
      const accountField = document.querySelector('.input-field[placeholder="10-digit account number"]');
      if (accountField) accountField.value = val;
    }

    function updateClock() {
      const el = document.getElementById('status-time');
      const now = new Date();
      el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    updateClock(); setInterval(updateClock, 1000);

    /* ===== Recipient lookup helpers ===== */
    const FAKE_ACCOUNTS = {
      '0123456789': { name: 'Ada Joy Okafor',   initials: 'AJ', bank: 'Antigravity Bank' },
      '0987654321': { name: 'Mike Okonkwo',      initials: 'MO', bank: 'GTBank'          },
      '1122334455': { name: 'Kemi Fashola',      initials: 'KF', bank: 'Zenith Bank'     },
      '5566778899': { name: 'Tunde Kola',        initials: 'TK', bank: 'First Bank'      },
      '9988776655': { name: 'Bisi Ibrahim',      initials: 'BI', bank: 'Access Bank'     },
    };

    let resolvedRecipient = null;
    let lookupTimer = null;

    function onRecipientInput(val) {
      const accountField = document.querySelector('.input-field[placeholder="10-digit account number"]');
      if (accountField) accountField.value = val;
      clearTimeout(lookupTimer);
      if (val.length === 10) {
        lookupTimer = setTimeout(() => resolveAccount(val), 600);
      } else {
        hideRecipientCard();
      }
    }

    function resolveAccount(acct) {
      const bankSelect = document.querySelector('select');
      const bank = bankSelect ? bankSelect.value : 'Antigravity Bank';
      const match = FAKE_ACCOUNTS[acct];
      const data = match || {
        name: 'Account Holder', initials: acct.slice(0,2).toUpperCase(), bank: bank
      };
      resolvedRecipient = { ...data, acct };
      showRecipientCard(data);
    }

    function showRecipientCard(data) {
      document.getElementById('recipient-initials').textContent = data.initials;
      document.getElementById('recipient-fullname').textContent = data.name;
      document.getElementById('recipient-bank-name').textContent = data.bank;
      const card = document.getElementById('verified-recipient-card');
      card.style.opacity = '1';
      const btn = document.getElementById('continue-btn');
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
    }

    function hideRecipientCard() {
      resolvedRecipient = null;
      const card = document.getElementById('verified-recipient-card');
      card.style.opacity = '0';
      const btn = document.getElementById('continue-btn');
      btn.style.opacity = '.4';
      btn.style.pointerEvents = 'none';
    }

    function goToAmount() {
      if (!resolvedRecipient) return;
      const p = new URLSearchParams({
        name:     resolvedRecipient.name,
        initials: resolvedRecipient.initials,
        bank:     resolvedRecipient.bank,
        acct:     resolvedRecipient.acct
      });
      window.location.href = 'amount.html?' + p.toString();
    }

    /* ===== UI helpers ===== */
    function focusRecipientInput() {
      document.getElementById('recipient-acct-input').focus();
    }

    document.addEventListener('DOMContentLoaded', function () {
      const input = document.getElementById('recipient-acct-input');
      const card  = document.getElementById('recipient-card');
      input.addEventListener('focus', function () {
        card.style.borderColor = 'var(--primary-blue)';
        card.style.boxShadow = '0 0 0 3px hsl(220,100%,93%)';
      });
      input.addEventListener('blur', function () {
        card.style.borderColor = 'transparent';
        card.style.boxShadow = 'none';
      });
    });

    function updateClock() {
      const el = document.getElementById('status-time');
      const now = new Date();
      el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    }
    updateClock(); setInterval(updateClock, 1000);
  </script>
</body>
</html>
