<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Bank – Next-Gen Mobile Banking Hub</title>
  <meta name="description" content="Experience instant, secure mobile banking with Antigravity Bank. Auto-navigating to secure login page.">
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --opay-green: #00B875;
      --opay-green-dark: #008a57;
      --opay-green-light: #e6f8f1;
      --opay-green-glow: rgba(0, 184, 117, 0.4);
      --opay-orange: #FF6B00;
      --bg-dark: #060B17;
      --card-bg-dark: rgba(15, 23, 42, 0.85);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-light: #F8FAFC;
      --text-muted: #94A3B8;
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-display: 'Outfit', sans-serif;
      --radius-lg: 28px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: var(--font-main);
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient Animated Glowing Orbs Background */
    .ambient-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 { top: -10%; left: -10%; width: 550px; height: 550px; background: radial-gradient(circle, #00B875 0%, rgba(0,184,117,0) 70%); }
    .orb-2 { bottom: -10%; right: -10%; width: 650px; height: 650px; background: radial-gradient(circle, #0284c7 0%, rgba(2,132,199,0) 70%); animation-delay: -5s; }
    .orb-3 { top: 40%; right: 25%; width: 350px; height: 350px; background: radial-gradient(circle, #7c3aed 0%, rgba(124,58,237,0) 70%); animation-delay: -9s; }
    
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.06); }
      100% { transform: translate(-30px, -20px) scale(0.95); }
    }

    /* Main Container */
    .splash-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 850px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 28px;
    }

    /* Center Brand Header */
    .splash-brand-group {
      margin-top: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .brand-logo-halo {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--opay-green), #007A4B);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      color: #ffffff;
      box-shadow: 0 15px 40px var(--opay-green-glow);
      animation: pulseLogo 3s ease-in-out infinite;
    }
    @keyframes pulseLogo {
      0%, 100% { transform: scale(1); box-shadow: 0 15px 40px rgba(0, 184, 117, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 20px 50px rgba(0, 184, 117, 0.75); }
    }

    .brand-name {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .brand-tagline {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
      max-width: 300px;
    }

    /* Bottom Action & Redirect Timer Controller */
    .splash-bottom-box {
      width: 100%;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Auto-Redirect Timer Bar */
    .timer-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      padding: 4px;
      border: 1px solid var(--glass-border);
      position: relative;
      overflow: hidden;
    }

    .timer-progress-bar {
      height: 6px;
      background: linear-gradient(90deg, var(--opay-green), #38BDF8);
      border-radius: 99px;
      width: 0%;
      transition: width 0.1s linear;
    }

    .timer-status-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 600;
    }
    .timer-seconds {
      color: var(--opay-green);
      font-weight: 800;
    }

    /* Buttons */
    .action-btn-main {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, var(--opay-green), var(--opay-green-dark));
      color: #ffffff;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 12px 30px var(--opay-green-glow);
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .action-btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(0, 184, 117, 0.5);
    }
    .action-btn-main:active {
      transform: scale(0.96);
    }

    .action-btn-sub {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .action-btn-sub:hover {
      color: #ffffff;
    }

    @media (max-width: 640px) {
      .splash-container {
        height: 100vh;
        max-height: 100vh;
        padding: 24px 18px;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Background Orbs -->
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- Splash Screen Mobile Container -->
  <div class="splash-container">
    
    <!-- Top Brand Header -->
    <div class="splash-brand-group">
      <div class="brand-logo-halo">
        <i class="fa-solid fa-bolt"></i>
      </div>
      <h1 class="brand-name">Antigravity Bank</h1>
      <p class="brand-tagline">Experience Next-Gen Mobile Banking Inspired by OPay</p>
    </div>

    <!-- Bottom Actions & Redirect Timer -->
    <div class="splash-bottom-box">
      
      <!-- Auto Redirect Progress Timer -->
      <div style="width:100%;">
        <div class="timer-container">
          <div class="timer-progress-bar" id="progress-bar"></div>
        </div>
        <div class="timer-status-text">
          Opening Secure Login in <span class="timer-seconds" id="seconds-text">3s</span>...
        </div>
      </div>

      <!-- Immediate Action Button -->
      <a href="login.html" class="action-btn-main" id="btn-proceed">
        <span>Proceed to Log In Now</span>
        <i class="fa-solid fa-arrow-right"></i>
      </a>

      <a href="signup.html" class="action-btn-sub">
        Don't have an account? <strong style="color:var(--opay-green);">Create Account</strong>
      </a>

    </div>

  </div>

  <script>
    // ===== AUTO REDIRECT COUNTDOWN LOGIC (3 SECONDS) =====
    const totalMs = 3000;
    const intervalMs = 30;
    let elapsedMs = 0;
    let redirectTimer;

    function startRedirectCountdown() {
      const progressBar = document.getElementById('progress-bar');
      const secondsText = document.getElementById('seconds-text');

      redirectTimer = setInterval(() => {
        elapsedMs += intervalMs;
        const progressPercent = Math.min(100, (elapsedMs / totalMs) * 100);
        const remainingSec = Math.max(0, Math.ceil((totalMs - elapsedMs) / 1000));

        if (progressBar) progressBar.style.width = progressPercent + '%';
        if (secondsText) secondsText.textContent = remainingSec + 's';

        if (elapsedMs >= totalMs) {
          clearInterval(redirectTimer);
          window.location.href = 'login.html';
        }
      }, intervalMs);
    }

    // Start timer on page load
    window.addEventListener('DOMContentLoaded', () => {
      startRedirectCountdown();
    });

    // Pause timer if user clicks proceed manually
    document.getElementById('btn-proceed')?.addEventListener('click', () => {
      clearInterval(redirectTimer);
    });
  </script>

</body>
</html>
