<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=login.html">
  <title>Antigravity Bank – Next-Gen Digital Banking</title>
  <meta name="description" content="Antigravity Bank – manage your money with ease. Smart savings, instant transfers, and real-time spending insights.">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-green: #10b981;
      --primary-blue: #0284c7;
      --bg-dark: #070d19;
      --glass-bg: rgba(15, 23, 42, 0.72);
      --glass-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body, html {
      width: 100%;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Glowing Orbs */
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .glow-1 {
      top: -15%;
      left: -10%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, #10b981 0%, rgba(16,185,129,0) 70%);
    }

    .glow-2 {
      bottom: -15%;
      right: -10%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, #0284c7 0%, rgba(2,132,199,0) 70%);
      animation-delay: -4s;
    }

    .glow-3 {
      top: 35%;
      right: 25%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, #8b5cf6 0%, rgba(139,92,246,0) 70%);
      animation-delay: -8s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, 40px) scale(1.06); }
      100% { transform: translate(-20px, 20px) scale(0.96); }
    }

    /* Top Navigation Header Bar */
    .app-nav {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 40px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 22px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    .brand-logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .nav-btn-link {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 99px;
      transition: all 0.25s ease;
    }

    .nav-btn-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    .nav-btn-primary {
      background: #ffffff;
      color: #0f172a;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 99px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(255, 255, 255, 0.25);
    }

    .nav-btn-primary:hover {
      background: #f8fafc;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.35);
    }

    /* Hero Center Stage */
    .main-stage {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 24px 60px;
      max-width: 980px;
      margin: 0 auto;
      text-align: center;
      flex: 1;
    }

    .hero-card {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 42px 48px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
      padding: 6px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 22px;
    }

    .hero-title {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(32px, 4.5vw, 54px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: clamp(14.5px, 1.7vw, 17.5px);
      color: rgba(255, 255, 255, 0.8);
      max-width: 640px;
      margin-bottom: 32px;
      line-height: 1.55;
    }

    /* Grid of Key Features */
    .features-pill-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
      margin-bottom: 34px;
    }

    .pill-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pill-card:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(16, 185, 129, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .pill-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .pill-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
    }

    .pill-desc {
      font-size: 11.5px;
      color: rgba(255, 255, 255, 0.65);
      text-align: center;
      line-height: 1.25;
    }

    /* Primary Action Buttons */
    .cta-button-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
      max-width: 500px;
    }

    .cta-btn-primary {
      flex: 1;
      height: 52px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
    }

    .cta-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(16, 185, 129, 0.55);
      background: linear-gradient(135deg, #34d399, #059669);
    }

    .cta-btn-secondary {
      flex: 1;
      height: 52px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .cta-btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }

    /* Footer */
    .app-footer {
      position: relative;
      z-index: 10;
      padding: 18px 40px;
      text-align: center;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(12px);
    }

    .app-footer a {
      color: rgba(255, 255, 255, 0.85);
      text-decoration: none;
      margin: 0 10px;
      transition: color 0.2s;
      cursor: pointer;
    }

    .app-footer a:hover {
      color: #38bdf8;
      text-decoration: underline;
    }

    /* Modal Overlay for Footer Links */
    .info-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7, 13, 25, 0.85);
      backdrop-filter: blur(16px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .info-modal-overlay.active {
      display: flex;
    }

    .info-modal-box {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.6);
      animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: #f8fafc;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .info-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .info-modal-title {
      font-size: 18px;
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .info-modal-close {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .info-modal-close:hover {
      background: rgba(239,68,68,0.2);
      color: #ef4444;
    }

    .info-modal-body {
      font-size: 13.5px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .app-nav { padding: 16px 20px; }
      .hero-card { padding: 28px 20px; border-radius: 24px; }
      .features-pill-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 24px; }
      .pill-card { padding: 12px 8px; }
      .hero-title { font-size: 28px; margin-bottom: 12px; }
      .hero-subtitle { font-size: 13.5px; margin-bottom: 22px; }
      .cta-button-group { flex-direction: column; gap: 10px; }
      .cta-btn-primary, .cta-btn-secondary { height: 48px; font-size: 15px; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Ambient Background Orbs -->
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>
  <div class="glow-orb glow-3"></div>

  <!-- Top Navigation Header Bar -->
  <header class="app-nav">
    <a href="index.html" class="brand-logo">
      <div class="brand-logo-icon">
        <i class="fa-solid fa-building-columns"></i>
      </div>
      Antigravity Bank
    </a>
    <div class="nav-actions" id="nav-actions">
      <a href="login.html" class="nav-btn-link" id="nav-signin">Sign In</a>
      <a href="login.html" class="nav-btn-primary" id="nav-openacct">Open Account</a>
    </div>
  </header>

  <!-- Hero Main Stage -->
  <main class="main-stage">
    <div class="hero-card">
      <div class="hero-badge">
        <i class="fa-solid fa-shield-halved"></i> Licensed by CBN · Insured by NDIC
      </div>

      <h1 class="hero-title">Banking Built for Your Future</h1>

      <!-- Direct Login Action -->
      <div class="cta-button-group" style="margin-top: 20px;">
        <a href="login.html" class="cta-btn-primary" id="btn-get-started">
          Go to Login Page <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <span>© 2026 Antigravity Bank Nigeria Ltd. All rights reserved.</span>
    &nbsp;·&nbsp; <a onclick="openInfoModal('privacy')">Privacy Policy</a>
    &nbsp;·&nbsp; <a onclick="openInfoModal('terms')">Terms of Service</a>
    &nbsp;·&nbsp; <a onclick="openInfoModal('security')">Security</a>
  </footer>

  <!-- Modal for Footer Info -->
  <div class="info-modal-overlay" id="info-modal">
    <div class="info-modal-box">
      <div class="info-modal-header">
        <div class="info-modal-title" id="info-modal-title"><i class="fa-solid fa-shield"></i> Security Notice</div>
        <button class="info-modal-close" onclick="closeInfoModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="info-modal-body" id="info-modal-body">
        Modal content details go here.
      </div>
      <button class="cta-btn-primary" style="height:44px;font-size:14px;" onclick="closeInfoModal()">Close</button>
    </div>
  </div>

  <script>
    // Redirect to login page directly
    window.location.href = 'login.html';

    // ===== DYNAMIC USER SESSION SYNC =====
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const stored = localStorage.getItem('antigravity_user') || sessionStorage.getItem('antigravity_user');
        if (stored) {
          const user = JSON.parse(stored);
          if (user && user.name) {
            const firstName = user.name.trim().split(' ')[0];

            // Update Topbar Nav Buttons
            const navSignin = document.getElementById('nav-signin');
            const navOpenAcct = document.getElementById('nav-openacct');
            if (navSignin) {
              navSignin.href = 'dashboard.html';
              navSignin.innerHTML = '<i class="fa-solid fa-gauge-high" style="margin-right:5px;"></i> Dashboard';
            }
            if (navOpenAcct) {
              navOpenAcct.href = 'dashboard.html';
              navOpenAcct.innerHTML = '<i class="fa-solid fa-circle-user" style="margin-right:5px;"></i> Hi, ' + firstName;
            }

            // Update Main CTA Buttons
            const btnGetStarted = document.getElementById('btn-get-started');
            const btnLogIn = document.getElementById('btn-log-in');
            if (btnGetStarted) {
              btnGetStarted.href = 'dashboard.html';
              btnGetStarted.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Go to My Dashboard';
            }
            if (btnLogIn) {
              btnLogIn.href = 'dashboard.html';
              btnLogIn.innerHTML = '<i class="fa-solid fa-user-check"></i> Account Active';
            }

            // Update Feature Pills
            ['pill-transfer', 'pill-savings', 'pill-cards', 'pill-bills'].forEach(id => {
              const el = document.getElementById(id);
              if (el) el.href = 'dashboard.html';
            });
          }
        }
      } catch(e) {
        console.warn('Session sync check failed:', e);
      }
    });

    // ===== FOOTER INFORMATIONAL MODALS =====
    function openInfoModal(type) {
      const modal = document.getElementById('info-modal');
      const title = document.getElementById('info-modal-title');
      const body = document.getElementById('info-modal-body');

      if (type === 'privacy') {
        title.innerHTML = '<i class="fa-solid fa-user-shield" style="color:#10b981;"></i> Privacy Policy';
        body.innerHTML = `
          <strong>Your Privacy is Our Top Priority</strong><br><br>
          At Antigravity Bank, we utilize 256-bit SSL encryption to ensure all personal identity information, transaction records, and biometric verification data remain strictly confidential.<br><br>
          • We never sell or share your data with third parties.<br>
          • All data complies with Nigeria Data Protection Regulation (NDPR) guidelines.<br>
          • You can request account data export or deletion at any time through Customer Support.
        `;
      } else if (type === 'terms') {
        title.innerHTML = '<i class="fa-solid fa-file-contract" style="color:#0284c7;"></i> Terms of Service';
        body.innerHTML = `
          <strong>Antigravity Digital Banking Agreement</strong><br><br>
          By creating an account with Antigravity Bank Nigeria Ltd, you agree to comply with CBN regulatory banking terms:<br><br>
          1. Tier 1 to Tier 3 transaction limits apply based on KYC verification.<br>
          2. Electronic transfers are processed instantly via the NIBSS central switch.<br>
          3. Daily yields on smart savings accrue automatically at midnight.<br>
          4. Debit cards are issued under Mastercard and Visa international standards.
        `;
      } else if (type === 'security') {
        title.innerHTML = '<i class="fa-solid fa-shield-halved" style="color:#38bdf8;"></i> Security & Compliance';
        body.innerHTML = `
          <strong>Bank-Grade 256-Bit Protection</strong><br><br>
          • <strong>NDIC Insured:</strong> Deposits up to ₦5,000,000 are fully insured by the Nigeria Deposit Insurance Corporation.<br>
          • <strong>CBN Licensed:</strong> Fully licensed by the Central Bank of Nigeria as a Mobile Money Operator.<br>
          • <strong>Biometric Auth:</strong> FaceID & Fingerprint scan authentication supported on all mobile logins.
        `;
      }
      modal.classList.add('active');
    }

    function closeInfoModal() {
      document.getElementById('info-modal').classList.remove('active');
    }
  </script>
</body>
</html>
